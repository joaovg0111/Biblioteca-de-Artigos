[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
addopts = --reuse-db --nomigrations --ds=config.settings
testpaths = apps tests_e2e
pythonpath = .
markers =
    django_db: mark test to use django database
    playwright: mark tests that require Playwright browser automation
env =
    DJANGO_ALLOW_ASYNC_UNSAFE=true
